name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version matching custom_components/slide_local/manifest.json"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out commit
        uses: actions/checkout@v4

      - name: Validate HACS integration
        uses: hacs/action@main
        with:
          category: integration

      - name: Validate version and release absence
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          manifest_version="$(jq -er '.version | strings' custom_components/slide_local/manifest.json)"
          if [[ "$INPUT_VERSION" != "$manifest_version" ]]; then
            echo "Input version '$INPUT_VERSION' does not match manifest version '$manifest_version'." >&2
            exit 1
          fi
          if gh release view "$INPUT_VERSION" >/dev/null 2>&1; then
            echo "A release for '$INPUT_VERSION' already exists." >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$INPUT_VERSION" >/dev/null 2>&1; then
            echo "A tag for '$INPUT_VERSION' already exists." >&2
            exit 1
          fi

      - name: Create GitHub release
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$INPUT_VERSION" --target "$GITHUB_SHA" --title "$INPUT_VERSION" --generate-notes
